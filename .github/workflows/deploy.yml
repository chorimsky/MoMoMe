# Continuous deployment for the settlement engine (Tier-1 item 3 of the infrastructure
# audit): main → PRODUCTION on every green run, gated by scripts/deploy-gate.sh (deep
# health + a synthetic quote on the NEW build) and rolled back to the previous deployment
# when the gate fails.
#
# WHY NOT STAGING. This used to send main → a Railway "staging" environment and only a
# version tag → production. That environment has never existed: `railway link -e staging`
# answers "Environment 'staging' not found", so the default path of this workflow could
# not have worked on any run. It was never noticed because every job on this repo has been
# refused before starting ("your account is locked due to a billing issue"), and the real
# deploys were going out through scripts/deploy.sh by hand — to production, on every push.
# This now describes that. Choosing `staging` by hand still works the moment someone
# creates the environment; until then it fails with Railway's own clear message rather
# than a missing-secret one.
#
# One-time setup (operator): repository secrets
#   RAILWAY_TOKEN              — a Railway project token (Project → Settings → Tokens)
#   PRODUCTION_API_URL         — https://momome-api-production.up.railway.app
#   STAGING_API_URL            — only if a staging environment is ever created
# The workflow uploads a clean `git archive` of the commit from the repository ROOT (the
# server build needs shared/ and railway.json) — never a working tree.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "production, or staging once that Railway environment exists"
        required: true
        default: production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @momome/server test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Staging only when someone explicitly asks for it; everything else is production.
      TARGET: ${{ github.event.inputs.environment == 'staging' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @railway/cli@4
      - name: Record the deployment to roll back to
        id: prev
        # A project token scopes the CLI to the project; no `railway link` (interactive) is needed.
        # One line of Python on purpose: a multi-line -c body inside this block scalar is what
        # broke the YAML and silently disabled every deploy run.
        run: |
          prev=$(railway deployment list --json --environment "$TARGET" --service momome-api 2>/dev/null | python3 -c 'import sys,json; d=[x for x in json.load(sys.stdin) if x.get("status")=="SUCCESS"]; print(d[0]["id"] if d else "")' 2>/dev/null || true)
          echo "id=$prev" >> "$GITHUB_OUTPUT"
      - name: Upload a clean export of this commit
        run: |
          mkdir -p /tmp/export && git archive "$GITHUB_SHA" | tar -x -C /tmp/export
          cd /tmp/export
          railway variables --environment "$TARGET" --service momome-api --set "APP_VERSION=$GITHUB_SHA" --skip-deploys
          railway up --detach --environment "$TARGET" --service momome-api
      - name: Gate — deep health + synthetic quote
        run: scripts/deploy-gate.sh "${{ env.TARGET == 'production' && secrets.PRODUCTION_API_URL || secrets.STAGING_API_URL }}" "$GITHUB_SHA"
      - name: Roll back on a failed gate
        if: failure() && steps.prev.outputs.id != ''
        run: |
          echo "gate failed — rolling back to previous SUCCESS deployment ${{ steps.prev.outputs.id }}"
          scripts/railway-rollback.sh "${{ steps.prev.outputs.id }}" || true
